# Host de backups (repo2 de pgBackRest): un S3 con HTTPS en OTRA máquina que el servidor de prod
# (servidor de la universidad, PC del laboratorio, NAS con Docker). Ver docs/08-despliegue.md, 8.4.
#
#   cp env.example .env   # dominio, credenciales S3 (las mismas que BACKUP_S3_* en el .env de prod)
#   docker compose up -d
#   docker compose exec seaweedfs sh -c 'echo "s3.bucket.create -name moda-backups" | weed shell'
#
# pgBackRest cifra todo (AES-256) antes de enviarlo: este host nunca ve datos en claro.
name: moda-backups

services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    environment:
      S3_KEY: ${BACKUP_S3_KEY:?falta BACKUP_S3_KEY}
      S3_SECRET: ${BACKUP_S3_KEY_SECRET:?falta BACKUP_S3_KEY_SECRET}
    # La config de identidades se genera al arrancar desde las variables (sin secretos en archivos del repo).
    entrypoint:
      - sh
      - -c
      - |
        mkdir -p /etc/seaweedfs
        printf '{"identities":[{"name":"pgbackrest","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read","Write","List","Tagging","Admin"]}]}' "$$S3_KEY" "$$S3_SECRET" > /etc/seaweedfs/s3.json
        exec /entrypoint.sh "$$@"
      - sh
    volumes: [backupdata:/data]
    restart: unless-stopped

  # TLS automático (Let's Encrypt) delante del S3. Puerto 443 abierto solo a la IP del servidor de prod.
  caddy:
    image: caddy:2-alpine
    ports: ["443:443", "80:80"]
    environment:
      BACKUP_S3_DOMAIN: ${BACKUP_S3_DOMAIN:?falta BACKUP_S3_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [seaweedfs]
    restart: unless-stopped

volumes:
  backupdata: {}
  caddydata: {}
