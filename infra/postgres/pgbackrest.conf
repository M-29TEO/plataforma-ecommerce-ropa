# pgBackRest de moda-ecommerce (docs/08-despliegue.md, sección Backups).
# Lo que cambia por entorno (cifrado, retención, copia fuera del servidor en repo2) llega por variables
# PGBACKREST_* del compose: cada opción de este archivo se puede pisar con PGBACKREST_<OPCION>.

[global]
# repo1: volumen local `pgbackrest` (recuperación rápida). En staging/prod se agrega repo2 fuera del host.
repo1-path=/var/lib/pgbackrest
repo1-retention-full=4
repo1-retention-full-type=count

compress-type=zst
process-max=2
start-fast=y
# Respaldo de cada WAL antes de borrarlo del servidor: archive-push es síncrono (sin cola local).
archive-async=n
archive-check=y
backup-standby=n

log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[moda]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
pg1-port=5432
# El superusuario del cluster es `app` (POSTGRES_USER), no `postgres`.
pg1-user=app
pg1-database=moda
