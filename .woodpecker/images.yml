# Imágenes de contenedor (docs/08-despliegue.md, sección "Pipeline"). Corre solo si ci.yml pasó.
# Por cada imagen (matriz): docker build -> Trivy sobre la imagen -> push al registro de Forgejo.
# Una imagen con vulnerabilidades HIGH/CRITICAL corregibles NO se publica.
#
# Tags: <sha de 8> siempre; `main` en la rama principal; `vX.Y...` en los tags de git (lo que despliega prod).
# Secretos del repo en Woodpecker: registry (p. ej. git.miuniversidad.edu.ec), registry_user, registry_token
# (token de Forgejo con permiso write:package) y public_site_url (URL pública del storefront).
when:
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: [tag, manual]

depends_on: [ci]

matrix:
  include:
    - IMAGE: api          # api, worker y realtime (misma imagen, otro command)
      CONTEXT: backend
    - IMAGE: web
      CONTEXT: storefront
    - IMAGE: backoffice
      CONTEXT: backoffice
    - IMAGE: postgres     # PostGIS + pgBackRest
      CONTEXT: infra/postgres
    - IMAGE: pasarela-simulada
      CONTEXT: simulators/payments
    - IMAGE: courier-simulado
      CONTEXT: simulators/courier
    - IMAGE: sri-simulado
      CONTEXT: simulators/sri

steps:
  - name: build-${IMAGE}
    image: docker:29-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      PUBLIC_SITE_URL:
        from_secret: public_site_url
    commands:
      - docker build --pull
        --label org.opencontainers.image.revision=${CI_COMMIT_SHA}
        --label org.opencontainers.image.source=${CI_REPO_URL}
        --build-arg NEXT_PUBLIC_SITE_URL=$${PUBLIC_SITE_URL:-http://localhost}
        -t moda-ci/${IMAGE}:${CI_COMMIT_SHA} ${CONTEXT}

  - name: trivy-${IMAGE}
    image: aquasec/trivy:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      # Solo lo que tiene parche (--ignore-unfixed): es lo que el equipo puede corregir subiendo versiones.
      - trivy image --image-src docker --scanners vuln,secret --severity HIGH,CRITICAL
        --ignore-unfixed --ignorefile .trivyignore --exit-code 1 --no-progress
        moda-ci/${IMAGE}:${CI_COMMIT_SHA}

  - name: push-${IMAGE}
    image: docker:29-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      REGISTRY:
        from_secret: registry
      REGISTRY_USER:
        from_secret: registry_user
      REGISTRY_TOKEN:
        from_secret: registry_token
    commands:
      - OWNER=$(echo "${CI_REPO_OWNER}" | tr '[:upper:]' '[:lower:]')
      - REPO="$${REGISTRY}/$${OWNER}/moda-${IMAGE}"
      - echo "$${REGISTRY_TOKEN}" | docker login "$${REGISTRY}" -u "$${REGISTRY_USER}" --password-stdin
      - TAGS="${CI_COMMIT_SHA:0:8}"
      - if [ "${CI_PIPELINE_EVENT}" = tag ]; then TAGS="$${TAGS} ${CI_COMMIT_TAG}"; fi
      - if [ "${CI_COMMIT_BRANCH}" = "${CI_REPO_DEFAULT_BRANCH}" ] && [ "${CI_PIPELINE_EVENT}" = push ]; then TAGS="$${TAGS} main"; fi
      - for t in $${TAGS}; do docker tag moda-ci/${IMAGE}:${CI_COMMIT_SHA} "$${REPO}:$${t}" && docker push "$${REPO}:$${t}" || exit 1; done
      - docker image rm moda-ci/${IMAGE}:${CI_COMMIT_SHA} >/dev/null || true
